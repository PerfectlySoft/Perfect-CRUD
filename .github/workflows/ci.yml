name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (Swift ${{ matrix.swift }}, ${{ matrix.configuration }})
    runs-on: ubuntu-24.04
    container: swift:${{ matrix.swift }}-noble
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported Swift (swift-tools-version 6.2) and the newest.
        swift: ["6.2", "6.4"]
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: swift --version

      - name: Build (warnings are errors)
        run: |
          flags="-c ${{ matrix.configuration }} -Xswiftc -warnings-as-errors"
          # @testable imports need testing enabled in an optimized build.
          [ "${{ matrix.configuration }}" = release ] && flags="$flags -Xswiftc -enable-testing"
          echo "FLAGS=$flags" >> "$GITHUB_ENV"
          swift build --build-tests $flags

      - name: Test
        run: swift test $FLAGS

  macos:
    name: macOS (Xcode ${{ matrix.xcode }}, ${{ matrix.configuration }})
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The oldest Xcode with Swift 6.2, and the runner's default. Swift 6.2 miscompiled an
        # existential in release builds that newer compilers handle, so both matter.
        xcode: ["26.0.1", "26.6"]
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
          swift --version

      - name: Build (warnings are errors)
        run: |
          flags="-c ${{ matrix.configuration }} -Xswiftc -warnings-as-errors"
          # @testable imports need testing enabled in an optimized build.
          [ "${{ matrix.configuration }}" = release ] && flags="$flags -Xswiftc -enable-testing"
          echo "FLAGS=$flags" >> "$GITHUB_ENV"
          swift build --build-tests $flags

      - name: Test
        run: swift test $FLAGS

  ios:
    name: iOS Simulator
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      # On a fresh runner the simulator service can start late, and xcodebuild then lists no
      # simulators at all ("Unable to find a device"). Wait until it offers the one we test on.
      # Listing devices with simctl makes the service refresh its runtimes
      # (actions/runner-images#12948).
      - name: Wait for the simulator
        run: |
          deadline=$((SECONDS + 300))
          while [ $SECONDS -lt $deadline ]; do
            xcrun simctl list devices available > /dev/null 2>&1 || true
            if destinations=$(xcodebuild -showdestinations -scheme PerfectCRUD) \
                && grep -q "name:iPhone 17 }" <<< "$destinations"; then
              exit 0
            fi
            echo "No iPhone 17 simulator yet; retrying in 5 seconds"
            sleep 5
          done
          echo "No iPhone 17 simulator after 5 minutes"
          xcrun simctl list devices available
          exit 1

      # The test target builds at the package's iOS 15 deployment target, so this also
      # catches APIs that need a newer iOS.
      - name: Test
        run: |
          xcodebuild test -scheme PerfectCRUD \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -destination-timeout 120 \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
